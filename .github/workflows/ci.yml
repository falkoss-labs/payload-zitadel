# SPDX-License-Identifier: MIT
name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm --filter dev generate:importmap
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build

    e2e:
        runs-on: ubuntu-latest
        needs: check
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter dev exec playwright install --with-deps chromium
            - run: pnpm --filter dev zitadel:up
            - run: pnpm --filter dev zitadel:setup
            - name: integration tests against Zitadel
              run: pnpm test:int
            - run: pnpm --filter dev generate:importmap
            - run: pnpm test:e2e
            - if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-traces
                  path: dev/test-results
            - if: failure()
              run: docker compose -f dev/zitadel/compose.yaml logs
