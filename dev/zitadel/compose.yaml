# local Zitadel for development and e2e tests, based on deploy/compose of zitadel/zitadel
# API: http://localhost:8080, Login UI v2: http://localhost:3001/ui/v2/login
# the bootstrap PATs land in ./.secrets and are consumed by setup.ts
name: payload-zitadel-dev

services:
    zitadel:
        image: ghcr.io/zitadel/zitadel:v4.20.0
        user: '0'
        command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters"
        environment:
            ZITADEL_PORT: 8080
            ZITADEL_EXTERNALDOMAIN: localhost
            ZITADEL_EXTERNALPORT: 8080
            ZITADEL_EXTERNALSECURE: false
            ZITADEL_TLS_ENABLED: false
            ZITADEL_DATABASE_POSTGRES_DSN: postgres://postgres:postgres@db:5432/zitadel?sslmode=disable
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Password1!
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
            ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: admin-sa
            ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Admin SA
            ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2519-04-01T08:45:00Z'
            ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
            ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
            ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login Client
            ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: '2519-04-01T08:45:00Z'
            ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
            ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
            ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:3001/ui/v2/login/
            ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:3001/ui/v2/login/login?authRequest=
            ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:3001/ui/v2/login/logout?post_logout_redirect=
        healthcheck:
            test: [CMD, /app/zitadel, ready]
            interval: 5s
            timeout: 30s
            retries: 30
            start_period: 20s
        ports:
            - 8080:8080
        volumes:
            - ./.secrets:/zitadel/bootstrap:rw
        depends_on:
            db:
                condition: service_healthy

    login:
        image: ghcr.io/zitadel/zitadel-login:v4.20.0
        user: '0'
        environment:
            ZITADEL_API_URL: http://zitadel:8080
            NEXT_PUBLIC_BASE_PATH: /ui/v2/login
            ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
            ZITADEL_SESSION_COOKIE_SECRET: SessionCookieSecretNeedsAtLeast32Chars
            CUSTOM_REQUEST_HEADERS: Host:localhost:8080,X-Forwarded-Proto:http
        healthcheck:
            test: [CMD, /bin/sh, -c, node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy]
            interval: 5s
            timeout: 30s
            retries: 30
            start_period: 10s
        ports:
            - 3001:3000
        volumes:
            - ./.secrets:/zitadel/bootstrap:ro
        depends_on:
            zitadel:
                condition: service_healthy

    db:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: zitadel
        healthcheck:
            test: [CMD-SHELL, pg_isready -d zitadel -U postgres]
            interval: 5s
            timeout: 30s
            retries: 10
